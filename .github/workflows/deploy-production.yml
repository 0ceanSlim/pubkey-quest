name: "Deploy: pubkey.quest"

# Manual promote: install one CI release on the official server. Only release
# binaries built and checksummed by the Release workflow ever run here
# (docs/draft/relay-saves-plan.md §6). Setup: docs/development/official-server.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to deploy (e.g. v0.1.12), or 'latest'"
        required: true
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: [self-hosted, official]

    steps:
      - name: Resolve the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ github.event.inputs.version }}"
          if [ "$V" = "latest" ]; then
            V=$(gh release list -R "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          fi
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "asset=pubkey-quest-${V}-linux-${ARCH}" >> "$GITHUB_OUTPUT"
          echo "Deploying $V ($ARCH)"

      - name: Download and verify the checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf promote && mkdir promote && cd promote
          gh release download "${{ steps.rel.outputs.version }}" -R "${{ github.repository }}" \
            -p "${{ steps.rel.outputs.asset }}" -p SHA256SUMS
          grep " ${{ steps.rel.outputs.asset }}\$" SHA256SUMS | sha256sum -c -
          chmod +x "${{ steps.rel.outputs.asset }}"
          ./"${{ steps.rel.outputs.asset }}" -version

      - name: Warn players and wait for them to save
        env:
          SERVICE: pubkey-quest
          GRACE: ${{ vars.PROD_RESTART_GRACE || 300 }}
          NEW_VERSION: ${{ steps.rel.outputs.version }}
        run: |
          # The running server picks up data/restart-notice.json within ~2s, shows
          # everyone online a countdown with a Save button, and answers in
          # data/restart-ack.json with how many players are online
          # (cmd/server/maintenance). Nobody online: restart straight away.
          if ! systemctl is-active --quiet "$SERVICE"; then echo "$SERVICE isn't running — nothing to warn"; exit 0; fi
          DATA="$(systemctl show "$SERVICE" -p WorkingDirectory --value)/data"
          mkdir -p "$DATA"
          rm -f "$DATA/restart-ack.json" || true
          printf '{"in_seconds": %d, "version": "%s"}\n' "$GRACE" "$NEW_VERSION" > "$DATA/restart-notice.json"
          online() { grep -o '"online":[0-9]*' "$DATA/restart-ack.json" 2>/dev/null | cut -d: -f2; }
          for i in $(seq 1 10); do [ -n "$(online)" ] && break; sleep 1; done
          N="$(online)"
          if [ -z "$N" ]; then echo "::warning::the server didn't acknowledge the notice; waiting the full ${GRACE}s"; fi
          if [ "$N" = "0" ]; then echo "Nobody online — restarting now"; exit 0; fi
          echo "${N:-?} player(s) online — giving them ${GRACE}s to save"
          END=$(( $(date +%s) + GRACE ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 5
            if [ "$(online)" = "0" ]; then echo "Everyone has left — restarting early"; break; fi
          done

      - name: Install
        run: |
          SERVICE_DIR=$(systemctl show pubkey-quest -p WorkingDirectory --value)
          if [ -z "$SERVICE_DIR" ]; then echo "::error::pubkey-quest service has no WorkingDirectory"; exit 1; fi
          sudo systemctl stop pubkey-quest
          # Keep the previous binary for a quick rollback.
          [ -f "$SERVICE_DIR/pubkey-quest" ] && cp "$SERVICE_DIR/pubkey-quest" "$SERVICE_DIR/pubkey-quest.previous"
          cp "promote/${{ steps.rel.outputs.asset }}" "$SERVICE_DIR/pubkey-quest"
          rm -f "$SERVICE_DIR/data/restart-notice.json" || true
          sudo systemctl start pubkey-quest

      - name: Verify
        run: |
          for i in $(seq 1 30); do
            if systemctl is-active --quiet pubkey-quest; then break; fi
            sleep 2
          done
          if ! systemctl is-active --quiet pubkey-quest; then
            echo "::error::pubkey-quest failed to start"
            journalctl -u pubkey-quest --no-pager -n 40 || true
            exit 1
          fi
          journalctl -u pubkey-quest --no-pager -n 15 || true
          echo "## Deployed ${{ steps.rel.outputs.version }} to pubkey.quest" >> "$GITHUB_STEP_SUMMARY"
