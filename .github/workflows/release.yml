name: Release

# A version tag pushed by hand (git tag v0.2.0 && git push origin v0.2.0) is a
# release: a single checksummed server binary per platform, with its game
# assets embedded (docs/draft/relay-saves-plan.md §6), which then goes live on
# pubkey.quest. Test keeps deploying every push to main (deploy-test.yml);
# the official server only changes when a tag says so.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main and passed CI
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SHA=$(git rev-parse HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$VERSION ($SHA) isn't on main — push the commit to main first"
            exit 1
          fi
          # CI runs on the push to main; a tag pushed straight after waits for it.
          for i in $(seq 1 40); do
            CONCLUSION=$(gh run list -R "${{ github.repository }}" --workflow ci.yml --commit "$SHA" \
              --json status,conclusion -q '[.[] | select(.status == "completed")][0].conclusion // empty')
            if [ "$CONCLUSION" = "success" ]; then echo "CI passed for $SHA"; exit 0; fi
            if [ -n "$CONCLUSION" ]; then echo "::error::CI $CONCLUSION for $SHA — not releasing"; exit 1; fi
            echo "Waiting for CI on $SHA…"
            sleep 30
          done
          echo "::error::no finished CI run for $SHA after 20 minutes"
          exit 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Generate swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/server/api/routes.go -o docs/api/swagger --parseDependency

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist-release
          for ARCH in amd64 arm64; do
            GOOS=linux GOARCH=$ARCH go build -tags release -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "dist-release/pubkey-quest-${VERSION}-linux-${ARCH}" ./cmd/server
          done
          cd dist-release
          sha256sum pubkey-quest-* > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Smoke test the amd64 binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./dist-release/pubkey-quest-${VERSION}-linux-amd64 -version

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist-release/* \
            --verify-tag \
            --title "$VERSION" \
            --notes "Built and checksummed by CI from $(git log -1 --pretty='%h %s'). Goes live on pubkey.quest automatically."

  # The release goes live: same steps as a manual "Deploy: pubkey.quest".
  deploy:
    needs: release
    uses: ./.github/workflows/deploy-production.yml
    with:
      version: ${{ needs.release.outputs.version }}
