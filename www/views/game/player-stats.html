{{define "game/player-stats.html"}}
<!-- Player Stats Area - Dark Win95 Style -->
<div class="p-1 space-y-1" style="flex-shrink: 0; font-size: 7px; width: 100%; box-sizing: border-box;">
    <!-- Identity: portrait, name + level, and the clock -->
    <div class="pq-id">
        <span id="char-portrait-thumb" class="pq-face" onclick="window.openPortraitDialog && window.openPortraitDialog()" title="Portrait: click to make or change"></span>
        <div class="pq-id-text">
            <div class="pq-name-row">
                <span id="char-name" class="pq-name">Character</span>
                <span class="pq-lv" onclick="window.openLevelGuide && window.openLevelGuide()" title="Level: click for the level guide">Lv <span id="char-level">1</span></span>
            </div>
            <div class="pq-clock-row">
                <!-- Wait Button -->
                <button id="time-wait-button" class="pq-tbtn" style="background:#8b9aaa;" onclick="window.openWaitModal()" title="Wait">🕐</button>
                <!-- Play Button (initially visible) -->
                <button id="time-play-button" class="pq-tbtn" style="background:#6b8e6b;" onclick="window.timeClock.play()" title="Let time run">▶</button>
                <!-- Pause Button (initially hidden) -->
                <button id="time-pause-button" class="pq-tbtn pq-tbtn-down" style="background:#a65b5b; display:none;" onclick="window.timeClock.pause()" title="Pause time">⏸</button>
                <!-- Time of day: the sun/moon and the clock -->
                <span id="time-indicator" class="pq-when">
                    <img id="time-of-day-image" src="/res/img/time/06-highnoon.png" alt="Time of day" class="pq-sun">
                    <span id="time-of-day-text-stats" class="pq-time">--:-- --</span>
                </span>
            </div>
            <!-- The day and weekday get their own line: the clock row has no room -->
            <div id="day-counter" class="pq-day">Day 1</div>
        </div>
    </div>

    <!-- Experience Bar (click to open the level progression guide) -->
    <div class="pq-bar" style="cursor: pointer;" onclick="window.openLevelGuide && window.openLevelGuide()" title="Experience: click for the level guide">
        <div id="exp-bar" class="pq-fill" style="width: 0%; background: linear-gradient(to bottom, #67e8f9 0%, #22d3ee 50%, #0891b2 100%);"></div>
        <span class="pq-bar-label">XP</span>
        <span class="pq-bar-value"><span id="current-exp">0</span>/<span id="exp-to-next">100</span></span>
    </div>

    <!-- HP Bar -->
    <div class="pq-bar">
        <div id="hp-bar" class="pq-fill" style="width: 100%; background: linear-gradient(to bottom, #dc2626 0%, #991b1b 50%, #7f1d1d 100%);"></div>
        <span class="pq-bar-label">HP</span>
        <span class="pq-bar-value"><span id="current-hp">0</span>/<span id="max-hp">0</span></span>
    </div>

    <!-- Resource Bar (Mana for casters, Stamina/Rage/Ki/Cunning for martials) -->
    <div class="pq-bar">
        <div id="mana-bar" class="pq-fill" style="width: 100%; background: linear-gradient(to bottom, #2563eb 0%, #1d4ed8 50%, #1e40af 100%);"></div>
        <span id="resource-label" class="pq-bar-label">MP</span>
        <span class="pq-bar-value"><span id="current-mana">0</span>/<span id="max-mana">0</span></span>
    </div>

    <!-- Quick Status Row (icons with radial progress) -->
    <div class="flex gap-3 justify-center items-center px-1 py-1" style="overflow: visible;">
        <!-- Fatigue with radial progress -->
        <div class="inline-flex items-center gap-1" style="line-height: 1; overflow: visible;">
            <div class="radial-icon-container" id="fatigue-icon-container" title="Fatigue: Fresh (0/10)" style="position: relative; width: 16px; height: 16px; display: inline-block;">
                <img id="fatigue-icon" src="/res/img/systems/fatigue/fatigue-00.png" alt="Fatigue" class="radial-icon-img" style="image-rendering: pixelated; width: 16px; height: 16px; position: relative; z-index: 2;">
                <svg class="radial-progress" viewBox="0 0 36 36" style="position: absolute; top: -4px; left: -4px; width: 24px; height: 24px; transform: rotate(-90deg); pointer-events: none; z-index: 1;">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
                    <circle cx="18" cy="18" r="15" id="fatigue-progress" fill="none" stroke="#00ddff" stroke-width="3"
                            stroke-dasharray="94.25" stroke-dashoffset="94.25" />
                </svg>
            </div>
            <span class="text-white" style="font-size: 8px; line-height: 12px;"><span id="fatigue-level">0</span>/10</span>
        </div>
        <!-- Hunger with radial progress -->
        <div class="inline-flex items-center gap-1" style="line-height: 1; overflow: visible;">
            <div class="radial-icon-container" id="hunger-icon-container" title="Hunger: Well Fed (2/3)" style="position: relative; width: 16px; height: 16px; display: inline-block;">
                <img id="hunger-icon" src="/res/img/systems/hunger/hunger-02.png" alt="Hunger" class="radial-icon-img" style="image-rendering: pixelated; width: 16px; height: 16px; position: relative; z-index: 2;">
                <svg class="radial-progress" viewBox="0 0 36 36" style="position: absolute; top: -4px; left: -4px; width: 24px; height: 24px; transform: rotate(-90deg); pointer-events: none; z-index: 1;">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
                    <circle cx="18" cy="18" r="15" id="hunger-progress" fill="none" stroke="#00ddff" stroke-width="3"
                            stroke-dasharray="94.25" stroke-dashoffset="94.25" />
                </svg>
            </div>
            <span class="text-white" style="font-size: 8px; line-height: 12px;"><span id="hunger-level">2</span>/3</span>
        </div>
        <!-- Weight -->
        <div class="inline-flex items-center gap-1" style="line-height: 1;">
            <span style="font-size: 10px; line-height: 12px;">⚖️</span>
            <span class="text-white" style="font-size: 8px; line-height: 12px;"><span id="char-weight">0</span>/<span id="max-weight">0</span></span>
        </div>
    </div>

    <!-- Active Effects Display (replaces stats grid) -->
    <div id="active-effects-display" class="flex flex-wrap gap-2 px-1 items-center justify-start" style="font-size: 6px; height: 24px; overflow: visible;">
        <!-- Effects will be rendered here by effectsDisplay.js -->
        <span class="text-gray-500 italic" id="no-effects-msg">No active effects</span>
    </div>
</div>
{{end}}
