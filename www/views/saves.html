{{define "title"}}Pubkey Quest - Select Save{{end}}

{{define "view"}}
<div class="max-w-4xl mx-auto p-6">
  <div class="text-center mb-8">
    <h1 class="text-2xl sm:text-4xl font-bold mb-2" style="color: var(--color-textHighlighted);">Choose Your Adventure</h1>
    <p class="text-sm sm:text-base" style="color: var(--color-textSecondary);">Every slot holds a different adventurer, drawn from your key</p>
  </div>

  <!-- Save Slots Section -->
  <div class="space-y-4 mb-8">
    <!-- Loading Placeholder -->
    <div id="saves-loading" class="text-center py-8">
      <div class="spinner-border animate-spin inline-block w-8 h-8 border-4 rounded-full" role="status">
        <span class="visually-hidden"></span>
      </div>
      <p class="mt-4" style="color: var(--color-textMuted);">Loading save slots...</p>
    </div>

    <!-- Shown while the relay sync runs behind the disk list -->
    <p id="saves-syncing" class="hidden text-center text-xs" style="color: var(--color-textMuted);">🔄 Checking your relays…</p>

    <!-- Save Slots Container -->
    <div id="save-slots-container" class="space-y-4 hidden">
      <!-- Slots will be populated here by JavaScript -->
    </div>
  </div>

  <!-- Back to Home -->
  <div class="text-center">
    <button onclick="goHome()"
            class="win95-button px-6 py-3 rounded-lg" style="color: var(--color-textPrimary);">
      🏠 Back to Home
    </button>
  </div>
</div>

<!-- NEW ES6 MODULE BUNDLE -->
<script type="module" src="/dist/saves.js?v={{.Version}}"></script>
<script>
// Helper function to show messages (fallback if game-ui.js not loaded yet)
if (typeof showMessage === 'undefined') {
  function showMessage(text, type = 'info', duration = 5000) {
    console.log(`[${type.toUpperCase()}] ${text}`);
  }
}

// The signed-in player (set once the session is up).
let currentNpub = null;

// Save slot configuration
const SAVE_SLOTS = [
  { id: 1, unlockLevel: 0, label: 'Start New Adventure' },
  { id: 2, unlockLevel: 5, label: 'Save Slot 2' },
  { id: 3, unlockLevel: 10, label: 'Save Slot 3' },
  { id: 4, unlockLevel: 15, label: 'Save Slot 4' },
  { id: 5, unlockLevel: 20, label: 'Save Slot 5' }
];

// Initialize save selection page
document.addEventListener('DOMContentLoaded', async function() {
  console.log('🎮 Initializing save selection page...');

  // Wait for session manager
  if (!window.sessionManager) {
    console.error('❌ SessionManager not available');
    showMessage('❌ Session manager not available', 'error');
    return;
  }

  try {
    await window.sessionManager.init();

    if (!window.sessionManager.isAuthenticated()) {
      console.log('❌ User not authenticated, redirecting to home');
      goHome();
      return;
    }

    const session = window.sessionManager.getSession();
    console.log('✅ User authenticated:', session.npub);
    currentNpub = session.npub;

    await loadSaveSlots(session.npub);

    // Hide loading modal if it's showing (from login flow)
    if (typeof hideLoadingModal === 'function') {
      hideLoadingModal();
    }

  } catch (error) {
    console.error('❌ Failed to initialize save selection:', error);
    showMessage('❌ Failed to load saves: ' + error.message, 'error');

    // Hide loading modal on error too
    if (typeof hideLoadingModal === 'function') {
      hideLoadingModal();
    }
  }
});

async function loadSaveSlots(npub) {
  console.log('📂 Loading save slots for:', npub);

  try {
    // Two passes: what this server already has on disk (instant), then again
    // after it has checked the player's relays (can take a few seconds), which
    // redraws only if something changed.
    const syncing = fetchSaves(npub, true);
    const local = await fetchSaves(npub, false);
    const shown = JSON.stringify(local);
    await renderSaves(npub, local);
    document.getElementById('saves-syncing').classList.remove('hidden');
    try {
      const synced = await syncing;
      if (JSON.stringify(synced) !== shown) await renderSaves(npub, synced);
    } catch (err) {
      console.warn('Relay check failed; showing the saves on this server:', err);
    } finally {
      document.getElementById('saves-syncing').classList.add('hidden');
    }

  } catch (error) {
    console.error('❌ Error loading save slots:', error);
    document.getElementById('saves-loading').innerHTML = `
      <div class="text-center py-8">
        <div class="text-xl mb-2" style="color: var(--color-textMuted);">❌</div>
        <p style="color: var(--color-textMuted);">Failed to load save slots</p>
        <p class="text-sm" style="color: var(--color-textMuted);">${error.message}</p>
      </div>
    `;
  }
}

// renderSaves draws the slots for a save list.
async function renderSaves(npub, saves) {
  const highestLevel = calculateHighestLevel(saves);
  // Who each slot would create. Derived from the npub alone, so a slot shows
  // its character whether or not it is unlocked or occupied.
  const roster = await fetchRoster(npub, highestLevel);
  displaySaveSlots(saves, highestLevel, roster);
  document.getElementById('saves-loading').classList.add('hidden');
  document.getElementById('save-slots-container').classList.remove('hidden');
}

// fetchSaves lists the player's saves; sync=false skips the relay check.
async function fetchSaves(npub, sync = true) {
  const response = await fetch(`/api/saves/${npub}${sync ? '' : '?sync=0'}`);
  if (!response.ok) {
    console.log('📭 No save files found');
    return [];
  }
  const saves = await response.json();
  console.log(`✅ Found ${saves.length} save files`);
  return saves;
}

async function fetchRoster(npub, highestLevel) {
  try {
    const response = await fetch(`/api/character/slots?npub=${encodeURIComponent(npub)}&highest_level=${highestLevel}`);
    if (!response.ok) return [];
    const data = await response.json();
    return data.slots || [];
  } catch (error) {
    console.warn('Could not load character previews:', error);
    return []; // slots still render, just without their preview
  }
}

function calculateHighestLevel(saves) {
  if (!saves || saves.length === 0) return 0;

  return Math.max(...saves.map(save => {
    const character = save.character || save;
    return save.level || 1; // the server derives it from XP
  }));
}

function displaySaveSlots(saves, highestLevel, roster) {
  const container = document.getElementById('save-slots-container');
  container.innerHTML = '';

  SAVE_SLOTS.forEach(slot => {
    const isUnlocked = highestLevel >= slot.unlockLevel;
    const saveData = saves.find(s => (s.slot_id || 1) === slot.id);
    const rosterSlot = roster.find(r => r.slot === slot.id);
    container.appendChild(createSaveSlot(slot, saveData, isUnlocked, rosterSlot));
  });
}

/**
 * One slot. Four states, and all of them name a character:
 *   occupied  — the character living there now
 *   open      — the one this slot would create, ready to start
 *   locked    — the same, shown early so there is something to play toward
 *   custom    — slot 5, which the player builds themselves at level 20
 */
function createSaveSlot(slot, saveData, isUnlocked, rosterSlot) {
  const div = document.createElement('div');

  if (saveData) {
    const saveId = saveData.id || saveData.internal_id;
    div.className = 'win95-outset rounded-lg p-4 transition-all cursor-pointer';
    // The details/delete row is not part of "click to continue".
    div.onclick = (e) => { if (!e.target.closest('[data-no-load]')) loadSave(saveId); };
    div.innerHTML = renderOccupied(saveData);
    const details = div.querySelector('details[data-save-event]');
    if (details) details.addEventListener('toggle', () => { if (details.open) loadSaveEvent(details, saveId); });
    const del = div.querySelector('[data-delete-save]');
    if (del) del.addEventListener('click', () => confirmDeleteSave(saveData));
    return div;
  }

  const custom = Boolean(rosterSlot?.custom);
  const preview = rosterSlot?.preview || null;

  if (!isUnlocked) {
    div.className = 'win95-inset rounded-lg p-4 opacity-70';
    div.innerHTML = renderUpcoming(slot, preview, custom);
    return div;
  }

  // Slot 1 is the primary call to action, so it keeps the bright treatment.
  div.className = slot.id === 1
    ? 'play-button-yellow rounded-lg p-4 transition-all cursor-pointer hover:scale-105'
    : 'win95-button rounded-lg p-4 transition-all cursor-pointer hover:scale-105';
  div.onclick = () => startNewGame(slot.id);
  div.innerHTML = renderStartable(slot, preview, custom);
  return div;
}

function renderOccupied(saveData) {
  const character = saveData.character || saveData;
  const race = character.race || saveData.race || 'Unknown';
  const characterClass = character.class || saveData.class || 'Adventurer';
  const name = character.name || saveData.d || 'Unnamed Hero';
  const hp = character.hp || saveData.hp || 0;
  const maxHp = character.max_hp || saveData.max_hp || 0;
  const level = saveData.level || 1; // the server derives it from XP
  const locationName = typeof saveData.location === 'string'
    ? saveData.location
    : (saveData.location?.current || 'Unknown Location');

  const stats = character.stats || saveData.stats || null;

  return `
    <div class="flex items-center space-x-4">
      <div class="w-14 h-14 flex-shrink-0 rounded-full win95-inset flex items-center justify-center">
        <span class="text-2xl">${getCharacterIcon(race, characterClass)}</span>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="font-bold truncate" style="color: var(--color-textHighlighted);">${escapeHtml(name)}</h3>
        <p class="text-sm truncate" style="color: var(--color-textSecondary);">Level ${level} ${escapeHtml(race)} ${escapeHtml(characterClass)}</p>
        <p class="text-xs truncate" style="color: var(--color-textMuted);">${escapeHtml(locationName)} · ${hp}/${maxHp} HP</p>
      </div>
      <div class="flex-shrink-0 text-xs" style="color: var(--color-textMuted);">Continue →</div>
    </div>
    ${renderStats(stats, 'normal')}
    ${saveData.relay_note ? `<p class="text-xs mt-1" style="color: var(--color-textMuted);">⚠ ${escapeHtml(saveData.relay_note)}</p>` : ''}
    <div class="flex items-start justify-between gap-2 mt-2" data-no-load style="cursor: default;">
      <details data-save-event class="flex-1 min-w-0 text-xs" style="color: var(--color-textMuted);">
        <summary class="cursor-pointer select-none">📜 Save details</summary>
        <div data-save-event-body class="mt-2">Loading…</div>
      </details>
      <button type="button" data-delete-save class="win95-button px-2 py-1 rounded text-xs flex-shrink-0"
              style="color: var(--color-textPrimary);" title="Delete this character">🗑 Delete</button>
    </div>
  `;
}

// ─── Save details: the signed relay event behind a save ──────────────────────

async function loadSaveEvent(details, saveId) {
  const body = details.querySelector('[data-save-event-body]');
  if (!body || body.dataset.loaded) return;
  try {
    const res = await fetch(`/api/saves/${currentNpub}/${encodeURIComponent(saveId)}/event`);
    const data = await res.json();
    body.dataset.loaded = '1';
    body.innerHTML = renderSaveEvent(data);
  } catch (error) {
    body.textContent = 'Could not load the save details: ' + error.message;
  }
}

function renderSaveEvent(data) {
  const ev = data.event;
  const lines = [];
  if (!data.relay_mode) {
    lines.push('This server keeps saves on its own disk; there is no relay event.');
  } else if (!ev) {
    lines.push('Not on your relays yet. This character only exists on this server until you save it in game.');
  } else {
    lines.push(`Event <span style="color: var(--color-textSecondary);">${escapeHtml(ev.id)}</span>`);
    lines.push(`Signed ${escapeHtml(new Date(ev.created_at * 1000).toLocaleString())} · ${(ev.content || '').length} bytes of save data`);
  }
  if (data.ledger) {
    const relays = (data.ledger.relays || []).map(escapeHtml).join(', ') || 'unknown relays';
    lines.push(`This server's record: accepted from ${relays}`);
  }
  const json = ev ? `<pre class="win95-inset p-2 mt-2 overflow-auto" style="max-height: 240px; font-size: 10px; white-space: pre-wrap; word-break: break-all; color: var(--color-textSecondary);">${escapeHtml(JSON.stringify(ev, null, 2))}</pre>` : '';
  return lines.map(l => `<p class="mb-1">${l}</p>`).join('') + json;
}

// ─── Deleting a save ─────────────────────────────────────────────────────────

function confirmDeleteSave(saveData) {
  const name = saveData.d || 'this character';
  const onRelays = Boolean(saveData.event_id);
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 flex items-center justify-center p-4';
  overlay.style.cssText = 'background: rgba(0,0,0,0.7); z-index: 200;';
  overlay.innerHTML = `
    <div class="win95-outset rounded-lg p-5 max-w-md w-full" style="background: var(--color-bgPrimary, #1f1f1f);">
      <h3 class="font-bold mb-3" style="color: var(--color-textHighlighted);">Delete ${escapeHtml(name)}?</h3>
      <p class="text-sm mb-2" style="color: var(--color-textSecondary);">
        ${onRelays
          ? 'This removes the character from this server and asks your relays to delete its save (you\'ll sign a deletion request).'
          : 'This removes the character from this server.'}
      </p>
      <p class="text-sm mb-4" style="color: var(--color-textMuted);">
        ${onRelays ? 'Some relays may keep a copy anyway, but the game won\'t load a deleted save again. ' : ''}This can't be undone.
      </p>
      <p data-delete-status class="text-sm mb-3 hidden" style="color: var(--color-textHighlighted);"></p>
      <div class="flex justify-end gap-2">
        <button type="button" data-cancel class="win95-button px-4 py-2 rounded" style="color: var(--color-textPrimary);">Keep it</button>
        <button type="button" data-confirm class="win95-button px-4 py-2 rounded font-bold" style="color: #f87171;">Delete forever</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('[data-cancel]').onclick = close;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-confirm]').onclick = async (e) => {
    const btn = e.currentTarget;
    const status = overlay.querySelector('[data-delete-status]');
    btn.disabled = true;
    try {
      await deleteSave(saveData, (text) => { status.textContent = text; status.classList.remove('hidden'); });
      close();
      showMessage(`🗑 ${name} deleted`, 'info');
      await loadSaveSlots(currentNpub);
    } catch (error) {
      status.textContent = error.message;
      status.classList.remove('hidden');
      btn.disabled = false;
    }
  };
}

async function deleteSave(saveData, setStatus) {
  const saveId = saveData.id || saveData.internal_id;
  let deletion = null;
  if (saveData.event_id) {
    // NIP-09: ask the relays to delete the save by its address and last event.
    const signer = window.pqSigner;
    const pubkey = window.sessionManager?.getPublicKey?.();
    if (!signer?.signEvent || !pubkey) {
      throw new Error('Your signer isn\'t ready — sign in again to delete a save from your relays.');
    }
    setStatus('Sign the deletion request…');
    try {
      deletion = await signer.signEvent({
        kind: 5,
        created_at: Math.floor(Date.now() / 1000),
        tags: [
          ['a', `30078:${pubkey}:${saveData.relay_d}`],
          ['e', saveData.event_id],
          ['k', '30078'],
        ],
        content: 'Deleted a Pubkey Quest save',
      });
    } catch (_) {
      throw new Error('Not deleted — the deletion request wasn\'t signed.');
    }
    setStatus('Asking your relays to delete it…');
  }
  const res = await fetch(`/api/saves/${currentNpub}/${encodeURIComponent(saveId)}`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ deletion }),
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || out.success === false) {
    throw new Error(out.error || `Delete failed (${res.status})`);
  }
  return out;
}

function renderStartable(slot, preview, custom) {
  const dark = slot.id === 1;
  const heading = dark ? 'color: rgb(41, 30, 0);' : 'color: var(--color-textHighlighted);';
  const body = dark ? 'color: rgba(41, 30, 0, 0.78);' : 'color: var(--color-textSecondary);';
  const ring = dark
    ? 'background: rgba(0, 0, 0, 0.16); border: 2px solid rgba(0, 0, 0, 0.28);'
    : '';

  if (custom) {
    return `
      <div class="flex items-center space-x-4">
        <div class="w-14 h-14 flex-shrink-0 rounded-full win95-inset flex items-center justify-center" style="${ring}">
          <span class="text-2xl">🛠️</span>
        </div>
        <div class="flex-1 text-left">
          <h3 class="font-extrabold" style="${heading}">▶ Build Your Own</h3>
          <p class="text-sm" style="${body}">Choose every detail yourself — earned at level 20</p>
        </div>
      </div>
    `;
  }

  return `
    <div class="flex items-center space-x-4">
      <div class="w-14 h-14 flex-shrink-0 rounded-full win95-inset flex items-center justify-center" style="${ring}">
        <span class="text-2xl">${preview ? getCharacterIcon(preview.race, preview.class) : '✨'}</span>
      </div>
      <div class="flex-1 text-left min-w-0">
        <h3 class="font-extrabold" style="${heading}">▶ ${slot.id === 1 ? 'Start New Adventure' : 'Start Slot ' + slot.id}</h3>
        ${preview ? `
          <p class="text-sm font-semibold truncate" style="${body}">${escapeHtml(preview.race)} ${escapeHtml(preview.class)} · ${escapeHtml(preview.background)}</p>
          <p class="text-xs truncate" style="${body}">${escapeHtml(preview.alignment)}</p>
        ` : `<p class="text-sm" style="${body}">Begin a fresh journey</p>`}
      </div>
    </div>
    ${preview ? renderStats(preview.stats, dark ? 'gold' : 'normal') : ''}
  `;
}

function renderUpcoming(slot, preview, custom) {
  if (custom) {
    return `
      <div class="flex items-center space-x-4">
        <div class="w-14 h-14 flex-shrink-0 rounded-full win95-inset flex items-center justify-center">
          <span class="text-2xl">🛠️</span>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="font-bold" style="color: var(--color-textSecondary);">Build Your Own</h3>
          <p class="text-sm" style="color: var(--color-textMuted);">Take a character to level ${slot.unlockLevel} and the next one is yours to design</p>
        </div>
        <div class="flex-shrink-0 text-xl">🔒</div>
      </div>
    `;
  }

  return `
    <div class="flex items-center space-x-4">
      <div class="w-14 h-14 flex-shrink-0 rounded-full win95-inset flex items-center justify-center" style="filter: grayscale(0.6);">
        <span class="text-2xl">${preview ? getCharacterIcon(preview.race, preview.class) : '🔒'}</span>
      </div>
      <div class="flex-1 min-w-0">
        ${preview ? `
          <h3 class="font-bold truncate" style="color: var(--color-textSecondary);">${escapeHtml(preview.race)} ${escapeHtml(preview.class)}</h3>
          <p class="text-xs truncate" style="color: var(--color-textMuted);">${escapeHtml(preview.background)} · ${escapeHtml(preview.alignment)}</p>
        ` : `<h3 class="font-bold" style="color: var(--color-textSecondary);">Slot ${slot.id}</h3>`}
        <p class="text-xs mt-1" style="color: var(--color-textMuted);">Reach level ${slot.unlockLevel} on any character to unlock</p>
      </div>
      <div class="flex-shrink-0 text-xl">🔒</div>
    </div>
    ${preview ? renderStats(preview.stats, 'muted') : ''}
  `;
}

// The six abilities, in the order players expect to read them.
const ABILITY_ORDER = ['Strength', 'Dexterity', 'Constitution', 'Intelligence', 'Wisdom', 'Charisma'];

/**
 * The ability block shown on a slot: every score plus their total.
 *
 * The total is the quickest way to compare two characters at a glance — rolls
 * land between 79 and 89, so the number says more than any single score does.
 * A live save shows what the character has now; an empty slot shows what it
 * would start with.
 *
 * @param {Object} stats - Ability name → score
 * @param {boolean} muted - Dim styling, for locked slots
 */
// tone: 'normal' (theme colours), 'muted' (locked slot), or 'gold' — the
// highlighted first slot, whose yellow face needs dark text to stay readable.
// The TOTAL box is a dark inset in every tone, so it keeps the theme colours.
function renderStats(stats, tone = 'normal') {
  if (!stats) return '';

  const entries = ABILITY_ORDER
    .filter((name) => stats[name] !== undefined)
    .map((name) => [name, stats[name]]);
  if (!entries.length) return '';

  const total = entries.reduce((sum, [, value]) => sum + (Number(value) || 0), 0);
  const muted = tone === 'muted';
  const totalLabel = muted ? 'color: var(--color-textMuted);' : 'color: var(--color-textSecondary);';
  const totalValue = muted ? 'color: var(--color-textSecondary);' : 'color: var(--color-textHighlighted);';
  const label = tone === 'gold' ? 'color: rgba(41, 30, 0, 0.72);' : totalLabel;
  const value = tone === 'gold' ? 'color: rgb(41, 30, 0);' : totalValue;

  const cells = entries.map(([name, score]) => `
    <div class="text-center">
      <div style="${label}; font-size: 9px;">${name.slice(0, 3).toUpperCase()}</div>
      <div class="font-bold" style="${value}; font-size: 12px;">${score}</div>
    </div>
  `).join('');

  return `
    <div class="flex items-center gap-2 mt-2">
      <div class="grid grid-cols-6 gap-1 flex-1">${cells}</div>
      <div class="flex-shrink-0 text-center px-2 win95-inset rounded" title="All six abilities added together">
        <div style="${totalLabel}; font-size: 9px;">TOTAL</div>
        <div class="font-bold" style="${totalValue}; font-size: 12px;">${total}</div>
      </div>
    </div>
  `;
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value ?? '';
  return div.innerHTML;
}

function getCharacterIcon(race, characterClass) {
  const icons = {
    'Human': '👤',
    'Elf': '🧝',
    'Dwarf': '🧔',
    'Halfling': '🧒',
    'Dragonborn': '🐲',
    'Gnome': '🧙',
    'Half-Elf': '👨‍🎤',
    'Half-Orc': '👹',
    'Tiefling': '😈'
  };

  return icons[race] || '⚔️';
}

function startNewGame(slotId) {
  console.log('🎮 Starting new game in slot:', slotId);
  showMessage('🎮 Starting new adventure...', 'info');

  // Navigate to character generation page with slot ID
  window.location.href = `/new-game?slot=${slotId}`;
}

function loadSave(saveId) {
  console.log('📂 Loading save:', saveId);
  showMessage('📂 Loading save file...', 'info');

  // Navigate to game with save ID
  window.location.href = `/game?save=${saveId}`;
}

function goHome() {
  window.location.href = '/';
}
</script>
{{end}}
