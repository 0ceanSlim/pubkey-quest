server:
  port: 8585
  tls: false # Set to true if using HTTPS
  debug_mode: true # Enable debug endpoints and features
  whitelist: # Pubkey whitelist (enforced when debug_mode is true)
    # - npub1example... # NPub format
    # - 1234567890abcdef... # Hex format
    # Connections from localhost/local network bypass whitelist
    # Non-whitelisted users request access via the in-game form (see report: below)

# In-game reporter: bug reports (🐛 button) + test-server access requests.
# Every submission is appended to data/reports/*.jsonl (the log you own). When a
# token + issue number are set, it's also posted as a comment on that pinned
# GitHub issue, which is how you get notified by email. Leave the token or an
# issue number empty/0 to log locally only (no GitHub post). config.yml is
# gitignored — keep the PAT here, never in committed files.
report:
  github_token: "" # GitHub PAT with repo:issues (public_repo) scope
  github_repo: "0ceanSlim/pubkey-quest" # owner/repo
  bug_issue_number: 0 # pinned issue that collects bug reports
  access_issue_number: 0 # pinned issue that collects access requests

pixellab:
  api_key: "your-pixellab-api-key-here"

# Saves (docs/draft/relay-saves-plan.md). With everything off, saves are disk files
# only (today's test server). The official server runs relay + validation, 5 slots,
# and refuses to start with server.debug_mode on.
saves:
  relay: false      # sign saves in the browser and publish them (kind 30078) to the player's relays
  validation: false # official only: play only the save this server last accepted (its ledger)
  max_slots: 0      # characters per key; official = 5, 0 = unlimited

# Wiki (docs/development/deployment/wiki.md): forward /wiki to a Gollum wiki started
# with --base-path wiki. Leave empty to serve no wiki.
wiki:
  url: "" # e.g. http://127.0.0.1:4567

# The Dungeon Master (docs/draft/server-stats.md §6): this server's own Nostr identity.
# He posts the game's news, signs badges and highscores, and takes bug reports and
# support by DM. Give each server its own key, so test's events never pass for
# official ones. The nsec is a private key: keep it here only (config.yml is
# gitignored) and back it up. The server checks that npub matches it at start.
dm:
  name: "The Dungeon Master"
  about: ""
  picture: "" # his media lives on Blossom, e.g. https://blossom.oslim.dev/<sha256>.jpg
  banner: ""
  nip05: ""   # e.g. dm@oslim.dev
  relays: []  # his NIP-65 relays (kind 10002): where his posts, badges and scores go
  inbox: []   # his NIP-17 DM relays (kind 10050): where bug reports and support reach him
  npub: ""
  nsec: ""
